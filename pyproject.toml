[tool.poetry]
name = "ats-parse"
version = "0.1.0"
description = "A simple ats-parsing tool using django and DRF"
authors = ["sushant <stha2022sushant@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.4"
psycopg2-binary = "^2.9.10"
django-environ = "^0.12.0"
strawberry-graphql-django = "^0.55.1"
strawberry-graphql = "^0.258.0"
django-debug-toolbar = "^5.0.1"
djangorestframework = "^3.15.2"
pdfplumber = "^0.11.5"
python-docx = "^1.1.2"
pymupdf = "^1.25.3"
django-filter = "^24.3"
python-magic = "^0.4.27"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
